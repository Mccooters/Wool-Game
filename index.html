<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>NEON DERAIL — Endless Convoy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#05060d; color:#e8f4ff;
    font-family:"Rajdhani",Menlo,Consolas,monospace; -webkit-font-smoothing:antialiased; }
  #wrap { height:100%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% -10%, #0a1122 0%, #05060d 65%, #030409 100%); }
  #game { position:relative; height:100%; width:100%; max-width:min(100vw, calc(100vh * 0.58)); overflow:hidden;
    box-shadow:0 0 70px rgba(0,140,255,.14); touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; top:calc(env(safe-area-inset-top, 0px) + 8px); left:0; right:0;
    display:flex; align-items:center; gap:8px; padding:0 10px; pointer-events:none; z-index:5; }
  .pill { pointer-events:auto; display:flex; align-items:center; gap:6px; font-weight:700; color:#cfe9ff;
    background:rgba(10,16,34,.82); border:1px solid rgba(120,200,255,.32);
    border-radius:6px; padding:6px 12px; font-size:13px; letter-spacing:2px;
    box-shadow:0 0 18px rgba(0,140,255,.14); }
  .pill.coins { color:#ffd76a; border-color:rgba(255,215,106,.35); margin-left:auto;
    box-shadow:0 0 18px rgba(255,190,60,.12); }
  .coin-ic { color:#ffd76a; font-size:14px; line-height:1; flex:none; }
  .coin-ic::before { content:"◆"; }
  .iconbtn { pointer-events:auto; width:36px; height:36px; border-radius:6px;
    border:1px solid rgba(120,200,255,.32); background:rgba(10,16,34,.82); cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(0,140,255,.14); }
  .iconbtn:active { transform:translateY(1px); }
  .iconbtn svg { display:block; }

  /* ---------- Boosters ---------- */
  #boosters { position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
    display:flex; justify-content:center; gap:10px; padding:0 10px; z-index:5; }
  .boost { position:relative; width:66px; padding:7px 0 6px; border-radius:6px; cursor:pointer; text-align:center;
    background:rgba(10,16,34,.86); border:1px solid rgba(120,200,255,.28);
    box-shadow:0 0 16px rgba(0,140,255,.12); transition:border-color .15s, box-shadow .15s, opacity .15s; }
  .boost:active { transform:translateY(1px); border-color:#7ef0ff; box-shadow:0 0 22px rgba(90,220,255,.4); }
  .boost .em { line-height:0; filter:drop-shadow(0 0 6px rgba(120,220,255,.35)); }
  .boost .em svg { display:inline-block; }
  .boost .nm { font-size:9px; font-weight:700; color:#8fd8ff; margin-top:3px; letter-spacing:1.6px; text-transform:uppercase; }
  .boost .cost { position:absolute; top:-8px; right:-6px; background:rgba(10,16,34,.95);
    border:1px solid rgba(255,215,106,.5); border-radius:5px; font-size:10px; font-weight:800; color:#ffd76a; padding:1px 5px;
    letter-spacing:.5px; }
  .boost .cost::before { content:"◆"; font-size:8px; margin-right:2px; }
  .boost.off { opacity:.4; pointer-events:none; }

  /* ---------- Toasts ---------- */
  #toasts { position:absolute; left:0; right:0; top:42%; display:flex; flex-direction:column; align-items:center;
    gap:6px; pointer-events:none; z-index:8; }
  .toast { background:rgba(10,16,34,.9); color:#ff9ab4; font-weight:700; font-size:12px; letter-spacing:2px;
    text-transform:uppercase; padding:8px 16px; border-radius:6px; border:1px solid rgba(255,120,160,.35);
    text-shadow:0 0 14px rgba(255,60,110,.5); opacity:0; transform:translateY(8px);
    animation:toast 2.2s ease forwards; }
  @keyframes toast { 8%{opacity:1; transform:none;} 78%{opacity:1; transform:none;} 100%{opacity:0; transform:translateY(-10px);} }

  /* ---------- Overlay ---------- */
  #overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(8,10,26,.88), rgba(2,3,8,.97)); z-index:10; }
  #overlay.show { display:flex; }
  .card { width:min(88%, 360px); padding:10px; text-align:center; animation:cardin .35s ease; }
  @keyframes cardin { from{transform:scale(.92); opacity:0;} }
  .card h1, .card h2 { font-weight:800; letter-spacing:6px; line-height:1.1; text-transform:uppercase;
    background:linear-gradient(180deg,#fff,#59d8ff 55%,#8a5bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 22px rgba(80,190,255,.5)); }
  .card h1 { font-size:34px; }
  .card h2 { font-size:24px; }
  .card p { color:#a9c8e6; font-size:13px; margin:12px 0 4px; line-height:1.6; letter-spacing:1px; }
  .card .big { font-size:40px; margin:8px 0; font-weight:800; color:#ffd76a; letter-spacing:2px;
    text-shadow:0 0 26px rgba(255,190,60,.5); }
  .btn { display:block; width:100%; margin-top:12px; padding:13px 0; border-radius:6px; border:none; cursor:pointer;
    font-size:16px; font-weight:800; letter-spacing:4px; text-transform:uppercase; color:#04121c;
    font-family:inherit; background:linear-gradient(180deg,#7ef0ff,#20a8ff);
    box-shadow:0 0 30px rgba(60,190,255,.45); transition:transform .1s, box-shadow .2s; }
  .btn:active { transform:translateY(1px); box-shadow:0 0 18px rgba(60,190,255,.35); }
  .btn.blue { background:linear-gradient(180deg,#b08cff,#6a3ce8); box-shadow:0 0 30px rgba(140,90,255,.4); }
  .btn.gold { background:linear-gradient(180deg,#ffe08a,#f0a41c); box-shadow:0 0 30px rgba(255,190,60,.4); }
  .btn.ghost { background:transparent; color:#8fd8ff; border:1px solid #2f6f9e; box-shadow:none;
    font-size:12px; padding:10px 0; letter-spacing:3px; }
  .btn.off { opacity:.35; pointer-events:none; }
  .howrow { display:flex; align-items:center; gap:12px; text-align:left; margin:12px 0; }
  .howrow .ic { font-size:15px; font-weight:800; letter-spacing:1px; color:#59d8ff; width:30px;
    text-align:center; flex:none; text-shadow:0 0 12px rgba(80,190,255,.6); }
  .howrow div { color:#a9c8e6; font-size:12px; line-height:1.55; letter-spacing:.6px; }
  .howrow b { color:#dffcff; }
  .logo { font-size:40px; line-height:1; margin-bottom:6px; filter:drop-shadow(0 0 16px rgba(120,220,255,.45)); }
  .stat { display:flex; justify-content:center; gap:16px; margin-top:8px; color:#7fb8e0; font-weight:700;
    font-size:12px; letter-spacing:2px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="pill" id="lvlPill">Level 1</div>
      <div class="pill coins" id="coinPill"><span class="coin-ic"></span><span id="coinVal">0</span></div>
      <button class="iconbtn" id="muteBtn" aria-label="Sound"></button>
      <button class="iconbtn" id="gearBtn" aria-label="Settings"></button>
    </div>
    <div id="boosters">
      <div class="boost" data-act="back"><span class="cost">40</span><div class="em"><svg width="20" height="20" viewBox="0 0 24 24" fill="#8fd8ff"><path d="M11 6v12L2.5 12 11 6zm9.5 0v12L12 12l8.5-6z"/></svg></div><div class="nm">Back</div></div>
      <div class="boost" data-act="chomp"><span class="cost">50</span><div class="em"><svg width="20" height="20" viewBox="0 0 24 24" fill="#ffd76a"><path d="M13 2L4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg></div><div class="nm">Strike</div></div>
      <div class="boost" data-act="fetch"><span class="cost">60</span><div class="em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2"><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></div><div class="nm">Pull</div></div>
      <div class="boost" data-act="slot"><span class="cost">80</span><div class="em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/></svg></div><div class="nm">+Slot</div></div>
    </div>
    <div id="toasts"></div>
    <div id="overlay"><div class="card" id="card"></div></div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   NEON DERAIL — Endless Convoy
   Eject arrow blocks from the board (each slides only in its
   arrow direction), turn them into cannons, and shoot down the
   armored convoy car by car before it reaches the core. Endless
   procedurally generated levels that ramp up in difficulty.
   ========================================================= */

// ---------- tiny utils ----------
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const rand  = (a,b)=>a+Math.random()*(b-a);
const randi = (a,b)=>Math.floor(rand(a,b+1));
const choice= a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const easeOutCubic = t=>1-Math.pow(1-t,3);
const easeInQuad   = t=>t*t;
const easeOutBack  = t=>{ const c=1.7; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); };
const key = (c,r)=>c+','+r;
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0],
               ul:[-1,-1], ur:[1,-1], dl:[-1,1], dr:[1,1] };
const ORTHO=['up','down','left','right'], DIAG=['ul','ur','dl','dr'];

// ---------- persistence ----------
const SAVE_KEY='woolcrush_v1';
let save = { level:1, coins:120, slot5:false, mute:false, seenHow:false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')); } catch(e){}
const persist = ()=>{ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} };

// ---------- palette ----------
const PALETTE = [
  {n:'cyan',   m:'#00e0ff', d:'#0a5f74', l:'#9ff4ff'},
  {n:'blue',   m:'#3f9bff', d:'#173f78', l:'#a8d4ff'},
  {n:'purple', m:'#9a6bff', d:'#3d2478', l:'#cdb5ff'},
  {n:'orange', m:'#ff8a3d', d:'#743a12', l:'#ffc9a1'},
  {n:'red',    m:'#ff3d71', d:'#701a33', l:'#ff9ab4'},
  {n:'gold',   m:'#ffce3d', d:'#745a10', l:'#ffe9a1'},
  {n:'mint',   m:'#4dffc9', d:'#146750', l:'#b3ffe8'},
  {n:'pink',   m:'#ff6be8', d:'#712a66', l:'#ffb5f4'},
];

// ---------- audio ----------
let AC=null, master=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);}catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol,delay=0){
  if(save.mute || !audio()) return;
  const t0=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
const sfx = {
  pop:   ()=>tone(520,900,0.09,'square',0.16),
  land:  ()=>tone(240,170,0.08,'sine',0.28),
  pew:   ()=>tone(1350,420,0.06,'sawtooth',0.07),
  chomp: ()=>{ tone(330,110,0.12,'sawtooth',0.2); tone(95,55,0.11,'square',0.22); },
  deny:  ()=>tone(150,110,0.1,'square',0.16),
  click: ()=>tone(720,720,0.05,'square',0.1),
  coin:  ()=>{ tone(900,1350,0.09,'square',0.13); tone(1350,1800,0.08,'square',0.1,0.07); },
  win:   ()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,0.14,'triangle',0.2,i*0.11)),
  lose:  ()=>[392,311,247].forEach((f,i)=>tone(f,f*0.92,0.2,'sawtooth',0.14,i*0.15)),
};
const buzz = p=>{ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

// ---------- canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
let A = {};             // layout areas, rebuilt on resize

function resize(){
  const g=document.getElementById('game');
  W=g.clientWidth; H=g.clientHeight; DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  A.snake = { x:0, y:0, w:W, h:H*0.335 };
  A.tray  = { x:0, y:H*0.345, w:W, h:H*0.088 };
  A.board = { x:W*0.02, y:H*0.452, w:W*0.96, h:H*0.40 };
  buildPath();
  layoutBoard();
}
window.addEventListener('resize', resize);

// cached radial glow sprites, one per color — shadowBlur in loops is too slow
const glowCache=new Map();
function glowSprite(color){
  let s=glowCache.get(color);
  if(!s){
    s=document.createElement('canvas'); s.width=s.height=64;
    const g=s.getContext('2d');
    const gr=g.createRadialGradient(32,32,2,32,32,32);
    gr.addColorStop(0,color); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(0,0,64,64);
    glowCache.set(color,s);
  }
  return s;
}
function drawGlow(x,y,r,color,alpha){
  ctx.globalAlpha=alpha;
  ctx.drawImage(glowSprite(color),x-r,y-r,r*2,r*2);
  ctx.globalAlpha=1;
}

// ---------- snake path (serpentine across the top area) ----------
let path = { pts:[], cum:[], len:1 };
function buildPath(){
  const a=A.snake, mx=a.w*0.115, top=a.h*0.24, mid=a.h*0.52, bot=a.h*0.80;
  const R1=(mid-top)/2, R2=(bot-mid)/2;
  const raw=[];
  const seg=(x0,y0,x1,y1)=>{ const n=28; for(let i=0;i<=n;i++) raw.push([lerp(x0,x1,i/n), lerp(y0,y1,i/n)]); };
  const arc=(cx,cy,r,a0,a1)=>{ const n=24; for(let i=1;i<=n;i++){ const t=lerp(a0,a1,i/n); raw.push([cx+Math.cos(t)*r, cy+Math.sin(t)*r]); } };
  // the path begins beyond the left edge so the body truly crawls in from offscreen
  seg(-a.w*0.18, top, a.w-mx, top);
  arc(a.w-mx, top+R1, R1, -Math.PI/2, Math.PI/2);
  seg(a.w-mx, mid, mx, mid);
  arc(mx, mid+R2, R2, -Math.PI/2, -Math.PI*1.5);
  seg(mx, bot, a.w*0.60, bot);
  const pts=[], cum=[0]; let L=0;
  for(let i=0;i<raw.length;i++){
    if(i>0){ const dx=raw[i][0]-raw[i-1][0], dy=raw[i][1]-raw[i-1][1]; const d=Math.hypot(dx,dy); if(d<0.4) continue; L+=d; cum.push(L); }
    pts.push(raw[i]);
  }
  let entryS=0;
  for(let i=0;i<pts.length;i++) if(pts[i][0]>=0){ entryS=cum[i]; break; }
  path={pts,cum,len:L,entryS};
}
function posAt(s){
  s=clamp(s,0,path.len);
  let lo=0, hi=path.cum.length-1;
  while(lo<hi){ const m=(lo+hi)>>1; if(path.cum[m]<s) lo=m+1; else hi=m; }
  const i=Math.max(1,lo);
  const t=(s-path.cum[i-1])/Math.max(0.0001,(path.cum[i]-path.cum[i-1]));
  const p0=path.pts[i-1], p1=path.pts[i];
  return { x:lerp(p0[0],p1[0],t), y:lerp(p0[1],p1[1],t), ang:Math.atan2(p1[1]-p0[1], p1[0]-p0[0]) };
}

// ---------- level generation ----------
function targetCells(L){ return L>=14 ? 52-randi(0,5) : 13+3*L; }
function creepFor(L){ return 0.020 + Math.min(0.042, 0.0014*L); }
function pushFactorFor(L){ return Math.max(0.34, 1.10-0.020*L); }
function nColorsFor(L){ return L>=24 ? 7 : clamp(3+Math.floor(L/5),3,6); }
function diagChanceFor(L){ return L<9 ? 0 : Math.min(0.35, 0.04+(L-8)*0.03); }
function runLenFor(L){ return L<6?randi(2,3) : L<16?randi(1,3) : randi(1,2); }
function windowFor(L,slots){ return clamp(1+Math.floor(L/6),1,Math.min(2,slots-1)); }
function doubleRatioFor(L){ return Math.min(0.25+L*0.03,0.6); }

const SHAPES=['diamond','rect','heart','cross','ring','tri'];
function shapePool(L){
  return L<6 ? ['diamond','rect','heart']
       : L<12 ? ['diamond','rect','heart','cross']
       : L<20 ? ['diamond','rect','heart','cross','tri']
       : SHAPES;
}
function edgeBiasFor(L){ return Math.max(0.05, 0.65-0.02*L); }
function maskFor(shape,target){
  let best=null;
  for(let s=2;s<=13;s++){
    const cells=[];
    if(shape==='diamond'){ for(let y=-s;y<=s;y++) for(let x=-s;x<=s;x++) if(Math.abs(x)+Math.abs(y)<=s) cells.push([x,y]); }
    else if(shape==='rect'){ const w=s+2,h=Math.max(2,Math.round(target/(s+2))); for(let y=0;y<h;y++) for(let x=0;x<w;x++) cells.push([x,y]); }
    else if(shape==='cross'){ const t=Math.max(1,Math.round(s/2)); for(let y=-s;y<=s;y++) for(let x=-s;x<=s;x++) if(Math.abs(x)<=t||Math.abs(y)<=t) cells.push([x,y]); }
    else if(shape==='ring'){ const h=Math.max(1,Math.round(s*0.45)); for(let y=-s;y<=s;y++) for(let x=-s;x<=s;x++){ const d=Math.abs(x)+Math.abs(y); if(d<=s&&d>h) cells.push([x,y]); } }
    else if(shape==='tri'){ for(let y=0;y<=s;y++) for(let x=-y;x<=y;x++) cells.push([x,y]); }
    else { // heart
      for(let y=-s;y<=s;y++) for(let x=-s;x<=s;x++){
        const px=x/(s*0.72), py=-y/(s*0.72)+0.28;
        const v=Math.pow(px*px+py*py-1,3)-px*px*py*py*py;
        if(v<=0) cells.push([x,y]);
      }
    }
    if(!cells.length) continue;
    if(!best || Math.abs(cells.length-target)<Math.abs(best.length-target)) best=cells;
    if(shape==='rect') break;
  }
  let minC=1e9,minR=1e9;
  for(const [x,y] of best){ minC=Math.min(minC,x); minR=Math.min(minR,y); }
  const mask=new Set(); let cols=0, rows=0;
  for(const [x,y] of best){ const c=x-minC, r=y-minR; mask.add(key(c,r)); cols=Math.max(cols,c+1); rows=Math.max(rows,r+1); }
  return {mask, cols, rows};
}

function tileMask(mask, dblRatio, edgeBias, cols, rows, diagChance){
  const cells=shuffle([...mask].map(k=>k.split(',').map(Number)));
  const used=new Set(), pieces=[]; let id=1;
  for(const [c,r] of cells){
    if(used.has(key(c,r))) continue;
    let placed=false;
    if(Math.random()<dblRatio){
      for(const axis of shuffle(['h','v'])){
        const [dc,dr]=axis==='h'?[1,0]:[0,1];
        const c2=c+dc, r2=r+dr;
        if(mask.has(key(c2,r2)) && !used.has(key(c2,r2))){
          used.add(key(c,r)); used.add(key(c2,r2));
          pieces.push({id:id++, cells:[{c,r},{c:c2,r:r2}], len:2, axis, dir:null, color:0, units:4, state:'board'});
          placed=true; break;
        }
      }
    }
    if(!placed){ used.add(key(c,r));
      pieces.push({id:id++, cells:[{c,r}], len:1, axis:null, dir:null, color:0, units:2, state:'board', diag:Math.random()<diagChance}); }
  }
  for(const p of pieces) rollDirBiased(p, edgeBias, cols, rows);
  return pieces;
}
function allowedDirs(p){
  return p.len===2 ? (p.axis==='h'?['left','right']:['up','down']) : (p.diag?DIAG:ORTHO);
}
function rollDir(p){ p.dir=choice(allowedDirs(p)); }
function stepsToEdge(cl,dc,dr,cols,rows){
  const sx=dc>0?cols-1-cl.c : dc<0?cl.c : 1e9;
  const sy=dr>0?rows-1-cl.r : dr<0?cl.r : 1e9;
  return Math.min(sx,sy);
}
function rollDirBiased(p, bias, cols, rows){
  const dirs=allowedDirs(p);
  if(Math.random()>=bias){ p.dir=choice(dirs); return; }
  // point toward the nearest board edge — early levels flow outward, late ones knot up
  let best=[], bestD=1e9;
  for(const d of dirs){
    const [dc,dr]=DIRS[d];
    let dist=1e9;
    for(const cl of p.cells) dist=Math.min(dist,stepsToEdge(cl,dc,dr,cols,rows));
    if(dist<bestD){ bestD=dist; best=[d]; }
    else if(dist===bestD) best.push(d);
  }
  p.dir=choice(best);
}
function leadCell(p){
  const [dc,dr]=DIRS[p.dir];
  return p.cells.reduce((a,b)=> (b.c*dc+b.r*dr)>(a.c*dc+a.r*dr)?b:a );
}
function exitBlocker(p, occ, cols, rows){
  const [dc,dr]=DIRS[p.dir]; let {c,r}=leadCell(p);
  while(true){ c+=dc; r+=dr;
    if(c<0||r<0||c>=cols||r>=rows) return null;
    const o=occ.get(key(c,r)); if(o && o!==p.id) return o;
  }
}
function simOrder(pieces, cols, rows){
  const occ=new Map();
  for(const p of pieces) for(const cl of p.cells) occ.set(key(cl.c,cl.r), p.id);
  const remaining=new Set(pieces), order=[]; let fixes=0;
  while(remaining.size){
    const frees=[...remaining].filter(p=>exitBlocker(p,occ,cols,rows)===null);
    if(!frees.length){
      if(++fixes>900) return null;
      rollDir(choice([...remaining])); continue;
    }
    const p=choice(frees);
    remaining.delete(p); order.push(p);
    for(const cl of p.cells) occ.delete(key(cl.c,cl.r));
  }
  return order;
}
function genLevel(L, slots){
  for(let attempt=0;attempt<40;attempt++){
    const pool=shapePool(L);
    const {mask,cols,rows}=maskFor(pool[(L-1+attempt)%pool.length], targetCells(L));
    const pieces=tileMask(mask, doubleRatioFor(L), edgeBiasFor(L), cols, rows, diagChanceFor(L));
    const order=simOrder(pieces, cols, rows);
    if(!order) continue;
    // colors assigned along the feasible order, in runs that shrink at higher levels
    const nCol=Math.min(nColorsFor(L), Math.max(2,Math.floor(order.length/2)));
    const colorIdx=shuffle([...PALETTE.keys()]).slice(0,nCol);
    let i=0, prev=-1;
    while(i<order.length){
      let col; do{ col=choice(colorIdx); }while(col===prev && nCol>1);
      const run=runLenFor(L);
      for(let j=0;j<run && i<order.length;j++,i++) order[i].color=col;
      prev=col;
    }
    // shuffle the feed order inside fixed windows — buffer needed stays < tray size
    const K=windowFor(L,slots);
    for(let s=0;s<order.length;s+=K+1){
      const block=order.slice(s,s+K+1); shuffle(block);
      for(let j=0;j<block.length;j++) order[s+j]=block[j];
    }
    const snake=[];
    for(const p of order) for(let u=0;u<p.len*2;u++) snake.push(p.color);
    return {pieces, snake, cols, rows, mask, nCol};
  }
  // practically unreachable; retry with a smaller board
  return genLevel(Math.max(1,L-3), slots);
}

// ---------- game state ----------
const G = {
  phase:'menu',            // menu | play | win | lose
  level:save.level,
  pieces:[], snake:[], snake0:0,
  cols:0, rows:0,
  cell:0, ox:0, oy:0,      // board cell px + origin
  segLen:16, thick:22,
  crawlT:0,
  front:0, frontTarget:0,  // dragon head position along the path (px of arc length)
  startFront:0, creep:0, graceT:0,
  segId:1,
  windCombo:0,
  tempSlot:false, usedSlotBoost:false, usedAnyBoost:false,
  particles:[], confetti:[], snow:[],
  mouthOpen:0, lastInput:0, hintPulse:0,
  reviveCount:0,
  catBlink:0,
};
for(let i=0;i<34;i++) G.snow.push({x:Math.random(),y:Math.random(),r:rand(1,2.6),v:rand(6,16),drift:rand(-6,6),a:rand(.3,.8)});

function permSlots(){ return 4 + (G.level>=6?1:0) + (save.slot5?1:0); }
function capacity(){ return permSlots() + (G.tempSlot?1:0); }
function occupancyPieces(){ return G.pieces.filter(p=>['extract','fly','tray'].includes(p.state)); }
// arc-length position of body segment i (0 = right behind the head)
function segS(i,seg){ return G.front-G.thick*0.4-(i+0.5)*G.segLen-(seg?seg.ofs:0); }
function segVisible(i){ return segS(i)>=path.entryS+G.segLen*0.4; }
function visibleColors(){
  const out=[];
  for(let i=0;i<G.snake.length && segVisible(i);i++) out.push(G.snake[i].c);
  return out;
}
function catParam(){ return path.len-6; }
function dangerFrac(){ return clamp(1-(catParam()-G.front)/(catParam()-G.startFront),0,1); }
function dragFront(px){
  // floor keeps a couple of segments windable at max pushback, but never pulls the dragon IN
  const floor=path.entryS+G.thick*0.4+G.segLen*2.2;
  G.frontTarget=Math.max(Math.min(G.frontTarget,floor), G.frontTarget-px);
}
function boardOcc(){
  const occ=new Map();
  for(const p of G.pieces) if(p.state==='board')
    for(const cl of p.cells) occ.set(key(cl.c,cl.r), p.id);
  return occ;
}
function pieceById(id){ return G.pieces.find(p=>p.id===id); }

function layoutBoard(){
  if(!G.cols) return;
  const a=A.board;
  G.cell=Math.min(a.w/G.cols, a.h/G.rows, 58);
  G.ox=a.x+(a.w-G.cell*G.cols)/2;
  G.oy=a.y+(a.h-G.cell*G.rows)/2;
  // the visible window shrinks at higher levels; the rest of the body waits offscreen
  const visTarget=clamp(30-G.level*0.45, 15, 30);
  const usable=Math.max(1,catParam()-path.entryS);
  G.segLen=clamp(usable*0.94/visTarget, 12, 36);
  G.thick=clamp(G.segLen*1.4, 12, A.snake.h*0.15);
  // the whole dragon starts offscreen and crawls in
  G.startFront=path.entryS-G.thick*2;
}

function startLevel(){
  const {pieces,snake,cols,rows,mask}=genLevel(G.level, permSlots());
  G.mask=mask;
  G.pieces=pieces;
  G.snake=snake.map(c=>({id:G.segId++, c, ofs:0}));
  G.snake0=snake.length;
  G.cols=cols; G.rows=rows;
  G.tempSlot=false; G.usedSlotBoost=false; G.usedAnyBoost=false;
  G.windCombo=0; G.particles.length=0; G.confetti.length=0;
  G.phase='play'; G.reviveCount=0;
  layoutBoard();
  G.front=G.frontTarget=G.startFront;
  G.creep=path.len*creepFor(G.level)*rand(0.95,1.05);
  G.graceT=2;
  pieces.forEach((p,i)=>{ p.drop={t:-i*0.018-0.05}; p.flash=0; p.bump=null; });
  updateHud();
  if(!save.seenHow){ save.seenHow=true; persist(); showHow(true); }
}

// ---------- tray geometry ----------
function traySlots(){
  const cap=capacity();
  const lockedLv5 = G.level<6 ? 1 : 0;
  const locked500 = save.slot5 ? 0 : 1;
  const total=cap+lockedLv5+locked500;
  const a=A.tray, s=Math.min(a.h*0.9, (a.w*0.9)/total - 8, 64);
  const w=total*(s+8)-8, x0=a.x+(a.w-w)/2, y=a.y+(a.h-s)/2;
  const out=[];
  for(let i=0;i<total;i++){
    out.push({ x:x0+i*(s+8), y, s,
      kind: i<cap ? 'open' : (lockedLv5 && i===cap ? 'lv5' : 'coin') });
  }
  return out;
}
function slotCenter(i){ const s=traySlots()[i]; return s?{x:s.x+s.s/2, y:s.y+s.s/2, s:s.s}:{x:W/2,y:A.tray.y+A.tray.h/2,s:40}; }
function freeSlotIndex(){
  const used=new Set(occupancyPieces().map(p=>p.slot).filter(v=>v!=null));
  for(let i=0;i<capacity();i++) if(!used.has(i)) return i;
  return null;
}
function headR(){ return clamp(G.thick*0.78+5,15,33); }
function headPos(){
  const p=posAt(G.front), R=headR();
  return { x:p.x+Math.cos(p.ang)*R*0.6, y:p.y+Math.sin(p.ang)*R*0.6, ang:p.ang };
}
function catPos(){
  const p=posAt(catParam());
  return { x:p.x+Math.cos(p.ang)*52, y:p.y+Math.sin(p.ang)*52-3 };
}

// ---------- interaction ----------
function pieceRect(p){
  let c0=1e9,r0=1e9,c1=-1e9,r1=-1e9;
  for(const cl of p.cells){ c0=Math.min(c0,cl.c); r0=Math.min(r0,cl.r); c1=Math.max(c1,cl.c); r1=Math.max(r1,cl.r); }
  return { x:G.ox+c0*G.cell, y:G.oy+r0*G.cell, w:(c1-c0+1)*G.cell, h:(r1-r0+1)*G.cell };
}
function tapBoard(px,py){
  for(const p of G.pieces){
    if(p.state!=='board') continue;
    const r=pieceRect(p);
    if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h){ tryExtract(p); return true; }
  }
  return false;
}
function tryExtract(p){
  const blocker=exitBlocker(p, boardOcc(), G.cols, G.rows);
  if(blocker!==null){
    p.bump={t:0}; sfx.deny();
    const b=pieceById(blocker); if(b) b.flash=1;
    return;
  }
  if(occupancyPieces().length>=capacity()){ toast('Slots full!'); sfx.deny(); p.bump={t:0}; return; }
  p.slot=freeSlotIndex();
  extract(p,false);
}
function extract(p, ignoreBlock){
  const [dc,dr]=DIRS[p.dir], lead=leadCell(p);
  let d=1;
  while(lead.c+dc*d>=0 && lead.r+dr*d>=0 && lead.c+dc*d<G.cols && lead.r+dr*d<G.rows) d++;
  p.exitCells=d+p.len+1.2;
  p.state='extract'; p.t=0; p.dur=clamp(p.exitCells*0.05,0.22,0.5);
  if(ignoreBlock) p.slot = p.slot!==undefined?p.slot:freeSlotIndex();
  sfx.pop(); G.lastInput=performance.now();
}

// ---------- firing: every cannon shoots the closest matching car on screen ----------
function spoolPos(p){
  const c=slotCenter(p.slot??0); return {x:c.x,y:c.y,s:c.s};
}
function segXY(i,seg){
  const p=posAt(Math.max(0.5,segS(i,seg)));
  return {x:p.x, y:p.y};
}
function startShots(){
  if(G.phase!=='play') return;
  for(const p of G.pieces){
    if(p.state!=='tray' || p.shot || p.reload>0) continue;
    for(let i=0;i<G.snake.length;i++){
      if(!segVisible(i)) break;
      const seg=G.snake[i];
      if(seg.c!==p.color || seg.aim) continue;
      seg.aim=p.id;                       // cars stay on the rails until the shell lands
      p.shot={t:0, seg};
      sfx.pew();
      break;
    }
  }
}
function impact(p){
  const seg=p.shot.seg; p.shot=null; p.reload=0.12;
  const idx=G.snake.indexOf(seg);
  if(idx<0) return;                       // target already purged — the shot fizzles, no shell spent
  const at=segXY(idx,seg);
  G.snake.splice(idx,1);
  for(let j=idx;j<G.snake.length;j++) G.snake[j].ofs+=G.segLen;  // couplers close the gap
  dragFront(G.segLen*pushFactorFor(G.level));      // every car destroyed knocks the train back
  G.windCombo++; G.comboT=1.0;
  boomFx(at,seg.c); buzz(8);
  tone(300+Math.min(400,G.windCombo*32),70,0.08,'square',0.13);
  p.units--;
  if(p.units<=0){                         // cannon out of shells: discharges, frees the slot
    p.state='gone'; p.slot=null;
    save.coins+=1; persist();
    sfx.coin(); popFx(p);
    compactTray();
  }
  updateHud();
  winCheck();
}
function compactTray(){
  const inTray=occupancyPieces().filter(p=>p.slot!=null).sort((a,b)=>a.slot-b.slot);
  inTray.forEach((p,i)=>{ p.slot=i; });
}
function windFx(at,col){
  const C=PALETTE[col];
  for(let i=0;i<5;i++) G.particles.push({x:at.x,y:at.y,vx:rand(-60,60),vy:rand(-90,-5),g:240,r:rand(1.5,3.5),c:C.m,t:0,dur:rand(.3,.5)});
}
function boomFx(at,col){
  const C=PALETTE[col];
  G.particles.push({x:at.x,y:at.y,vx:0,vy:0,g:0,r:rand(9,13),c:'#ffffff',t:0,dur:0.14,glow:true});
  for(let i=0;i<10;i++) G.particles.push({x:at.x,y:at.y,vx:rand(-140,140),vy:rand(-140,60),g:200,r:rand(1.5,3.8),c:i%3?C.m:'#ffbe3d',t:0,dur:rand(.25,.5)});
}
function popFx(p){
  const s=spoolPos(p), C=PALETTE[p.color];
  for(let i=0;i<12;i++) G.particles.push({x:s.x,y:s.y,vx:rand(-120,120),vy:rand(-160,-20),g:340,r:rand(2,4.5),c:i%3?C.m:'#ffd95e',t:0,dur:rand(.4,.7)});
}

// ---------- end conditions ----------
function winCheck(){
  if(G.phase==='play' && !G.snake.length && !G.pieces.some(p=>p.shot)) win();
}
function win(){
  G.phase='win';
  const reward=25+Math.min(35,2*G.level)+(G.usedAnyBoost?0:10);
  save.coins+=reward; save.level=G.level+1; persist();
  sfx.win(); buzz([30,40,60]);
  for(let i=0;i<90;i++) G.confetti.push({x:rand(0,W),y:rand(-H*0.3,0),vx:rand(-30,30),vy:rand(40,140),r:rand(2.5,5),c:PALETTE[randi(0,7)].m,t:0,dur:rand(1.2,2.2),sp:rand(2,7)});
  setTimeout(()=>showWin(reward),900);
  updateHud();
}
function lose(){
  if(G.phase!=='play') return;
  G.phase='lose';
  sfx.lose(); buzz(80);
  setTimeout(()=>showLose(),500);
}

// ---------- boosters ----------
const PRICES={back:40,chomp:50,fetch:60,slot:80,revive:100,slot5:500};
function spend(n){ if(save.coins<n){ toast('Not enough coins!'); sfx.deny(); return false; }
  save.coins-=n; persist(); updateHud(); sfx.coin(); G.usedAnyBoost=true; return true; }
function pushBack(frac){
  dragFront(path.len*frac);
  G.graceT=Math.max(G.graceT,1.2);
  const h=headPos();
  for(let i=0;i<10;i++) G.particles.push({x:h.x,y:h.y,vx:rand(-140,-40),vy:rand(-60,60),g:0,r:rand(2,4),c:'#ffffff',t:0,dur:rand(.3,.5)});
}
function boostBack(){
  if(!spend(PRICES.back)) return;
  pushBack(0.18); sfx.pop(); toast('Pushed back!');
}
function consumeCapacity(col,amount){
  // keep color totals balanced: burn matching wrap capacity somewhere
  let left=amount;
  const trayP=G.pieces.find(p=>p.state==='tray'&&p.color===col&&!p.shot);
  if(trayP){ const take=Math.min(left,trayP.units); trayP.units-=take; left-=take;
    if(trayP.units<=0){ trayP.state='gone'; trayP.slot=null; popFx(trayP); compactTray(); } }
  if(left>0){
    const boardP=G.pieces.filter(p=>p.state==='board'&&p.color===col).sort((a,b)=>a.units-b.units)[0];
    if(boardP){ boardP.units-=left;
      if(boardP.units<=0) boardP.state='gone';
      else if(boardP.len===2&&boardP.units<=2){ boardP.len=1; boardP.cells=[leadCell(boardP)]; boardP.axis=null; }
    }
  }
}
function boostChomp(){
  if(!G.snake.length) return;
  if(!spend(PRICES.chomp)) return;
  const n=Math.min(2,G.snake.length);
  for(let i=0;i<n;i++){
    const seg=G.snake.shift();
    for(const s2 of G.snake) s2.ofs+=G.segLen;
    consumeCapacity(seg.c,1);
    dragFront(G.segLen);
    windFx(headPos(),seg.c);
  }
  G.mouthOpen=1; sfx.chomp();
  updateHud(); winCheck();
}
function boostFetch(){
  const vis=visibleColors(); if(!vis.length) return;
  if(occupancyPieces().length>=capacity()){ toast('Slots full!'); sfx.deny(); return; }
  // grab a bolt for the color closest to the dragon's head
  let target=null;
  for(const col of vis){
    const cands=G.pieces.filter(p=>p.state==='board'&&p.color===col);
    if(cands.length){ const occ=boardOcc();
      target=cands.find(q=>exitBlocker(q,occ,G.cols,G.rows)===null)||cands[0]; break; }
  }
  if(!target){ toast('No matching block on board'); sfx.deny(); return; }
  if(!spend(PRICES.fetch)) return;
  target.slot=freeSlotIndex();
  extract(target,true);
}
function boostSlot(){
  if(G.usedSlotBoost){ toast('Already added this level'); sfx.deny(); return; }
  if(!spend(PRICES.slot)) return;
  G.tempSlot=true; G.usedSlotBoost=true; toast('Extra slot for this level!');
  updateHud();
}
document.getElementById('boosters').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.boost'); if(!b||G.phase!=='play') return;
  audio(); sfx.click();
  ({back:boostBack,chomp:boostChomp,fetch:boostFetch,slot:boostSlot})[b.dataset.act]();
});

// ---------- HUD / overlay ----------
const $=id=>document.getElementById(id);
const ICONS={
  sndOn:'<svg width="19" height="19" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="#8fd8ff"/><path d="M16.5 8.5a5 5 0 010 7" stroke="#8fd8ff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
  sndOff:'<svg width="19" height="19" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.5v-15L8 9H4z" fill="#8fd8ff" opacity="0.6"/><path d="M15.5 9L21 14.5M21 9l-5.5 5.5" stroke="#ff9ab4" stroke-width="2.4" stroke-linecap="round"/></svg>',
  gear:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8fd8ff" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>',
};
function updateHud(){
  $('lvlPill').textContent='Level '+G.level;
  $('coinVal').textContent=save.coins;
  $('muteBtn').innerHTML=save.mute?ICONS.sndOff:ICONS.sndOn;
  document.querySelectorAll('.boost').forEach(b=>{
    const cost=PRICES[b.dataset.act==='slot'?'slot':b.dataset.act];
    b.classList.toggle('off', G.phase!=='play'||save.coins<cost||(b.dataset.act==='slot'&&G.usedSlotBoost));
  });
}
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('toasts').appendChild(t); setTimeout(()=>t.remove(),2300);
}
function overlay(html){ $('card').innerHTML=html; $('overlay').classList.add('show'); }
function hideOverlay(){ $('overlay').classList.remove('show'); }

function showMenu(){
  G.phase='menu';
  overlay(`<h1>Neon Derail</h1>
    <p style="letter-spacing:5px;color:#79c8ff;margin-top:6px">ENDLESS CONVOY</p>
    <p>Shoot down the convoy before it reaches the core.<br>Endless levels — each one harder than the last.</p>
    <div class="stat"><span>LV ${G.level}</span><span style="color:#ffd76a">◆ ${save.coins}</span></div>
    <button class="btn" data-act="play">Play Level ${G.level}</button>
    <button class="btn ghost" data-act="how">How to play</button>`);
  updateHud();
}
function showHow(fromStart){
  overlay(`<h2>How to play</h2>
    <div class="howrow"><span class="ic">01</span><div>Tap a block to eject it — it only slides in its <b>arrow direction</b>, and the path must be clear.</div></div>
    <div class="howrow"><span class="ic">02</span><div>Ejected blocks become <b>cannons</b>. A cannon auto-fires at <b>any matching car on screen</b> — out of shells, it discharges and frees its slot.</div></div>

    <div class="howrow"><span class="ic">04</span><div>A dimmed cannon has no target on screen yet — it blocks its slot until its color rolls in.</div></div>
    <button class="btn blue" data-act="${fromStart?'resume':'menu'}">Got it</button>`);
}
function showWin(reward){
  overlay(`<h2>Convoy derailed</h2>
    <div class="big">◆ +${reward}</div>
    <p>${G.usedAnyBoost?'':'Perfect — no boosters used (+10)<br>'}The core holds… until Level ${G.level+1}.</p>
    <button class="btn" data-act="next">Next Level</button>`);
}
function showLose(){
  const can=save.coins>=PRICES.revive && G.reviveCount<2;
  overlay(`<h2>Core overrun</h2>
    <p>The convoy crossed the whole line. Fire faster — every car destroyed knocks it back.</p>
    <button class="btn gold ${can?'':'off'}" data-act="revive">« Push it way back — ◆ ${PRICES.revive}</button>
    <button class="btn blue" data-act="retry">Retry Level ${G.level}</button>`);
}
function showSettings(){
  overlay(`<h2>Settings</h2>
    <button class="btn blue" data-act="mute">${save.mute?'🔇 Sound: Off':'🔊 Sound: On'}</button>
    <button class="btn ghost" data-act="how2">How to play</button>
    <button class="btn ghost" data-act="retry">↻ Restart level</button>
    <button class="btn ghost" data-act="wipe">⚠ Reset all progress</button>
    <button class="btn" data-act="resume">Continue</button>`);
}
function revive(){
  if(save.coins<PRICES.revive||G.reviveCount>=2) return;
  save.coins-=PRICES.revive; persist(); G.reviveCount++; sfx.coin();
  hideOverlay(); G.phase='play';
  pushBack(0.40); G.graceT=2.5;
  updateHud();
}
$('card').addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  audio(); sfx.click();
  const act=b.dataset.act;
  if(act==='play'||act==='next'||act==='retry'){ if(act==='next') G.level=save.level; hideOverlay(); startLevel(); }
  else if(act==='how') showHow(false);
  else if(act==='how2') showHow(true);
  else if(act==='menu') showMenu();
  else if(act==='resume'){ hideOverlay(); if(G.phase!=='play') G.phase='play'; updateHud(); }
  else if(act==='revive') revive();
  else if(act==='mute'){ save.mute=!save.mute; persist(); showSettings(); updateHud(); }
  else if(act==='wipe'){ localStorage.removeItem(SAVE_KEY); location.reload(); }
});

// ---------- update ----------
let lastT=performance.now();
function update(dt){
  G.crawlT+=dt;
  G.mouthOpen=Math.max(0,G.mouthOpen-dt*5);
  G.catBlink-=dt; if(G.catBlink<-0.15) G.catBlink=rand(2,5);

  for(const s of G.snow){ s.y+=s.v*dt/H; s.x+=s.drift*dt/W; if(s.y>1.02){ s.y=-0.02; s.x=Math.random(); } }

  // the dragon advances; winding drags frontTarget back
  if(G.phase==='play'){
    if(G.graceT>0) G.graceT-=dt;
    else G.frontTarget+=G.creep*dt;
    G.front+=(G.frontTarget-G.front)*Math.min(1,dt*9);
    if(G.front>=catParam()) lose();
  }

  for(const p of G.pieces){
    if(p.flash>0) p.flash=Math.max(0,p.flash-dt*2.5);
    if(p.bump){ p.bump.t+=dt/0.18; if(p.bump.t>=1) p.bump=null; }
    if(p.drop && p.drop.t<1) p.drop.t+=dt/0.42;
    if(p.landBounce>0) p.landBounce=Math.max(0,p.landBounce-dt*4);
    if(p.state==='extract'){
      p.t+=dt/p.dur;
      if(p.t>=1){
        p.state='fly'; p.t=0;
        const r=pieceRect(p), [dc,dr]=DIRS[p.dir], d=p.exitCells*G.cell;
        p.fx=r.x+r.w/2+dc*d; p.fy=r.y+r.h/2+dr*d;
      }
    } else if(p.state==='fly'){
      p.t+=dt/0.42;
      if(p.t>=1){
        p.state='tray';
        p.landT=performance.now(); p.landBounce=1; sfx.land();
      }
    }
  }
  // firing: cannons acquire matching cars and shoot
  startShots();
  for(const p of G.pieces){
    if(p.reload>0) p.reload-=dt;
    if(!p.shot) continue;
    p.shot.t+=dt/0.18;
    if(p.shot.t>=1) impact(p);
  }
  G.comboT=(G.comboT||0)-dt;
  if(G.comboT<=0) G.windCombo=0;
  for(const seg of G.snake) if(seg.ofs>0) seg.ofs=Math.max(0,seg.ofs-dt*G.segLen*6);
  // nudge the player when the tray is clogged
  G.stallT=(G.stallT||0)+dt;
  if(G.phase==='play' && G.stallT>5){
    G.stallT=0;
    const vis=new Set(visibleColors());
    if(occupancyPieces().length>=capacity() &&
       !G.pieces.some(p=>p.state==='tray'&&(p.ball||vis.has(p.color))))
      toast('Cannons holding fire — no target on screen');
  }
  // fire breath when the dragon is close to the cat
  if(G.phase==='play' && dangerFrac()>0.68 && Math.random()<dt*22){
    const h=headPos();
    G.particles.push({x:h.x+headR()*0.9,y:h.y,vx:rand(90,190),vy:rand(-22,22),g:-20,
      r:rand(2.5,5.5),c:Math.random()<0.5?'#ffb03a':'#ff7b1f',t:0,dur:rand(.25,.45),glow:true});
  }
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i]; p.t+=dt;
    if(p.t>=p.dur){ G.particles.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=G.confetti.length-1;i>=0;i--){
    const c=G.confetti[i]; c.t+=dt;
    if(c.t>=c.dur){ G.confetti.splice(i,1); continue; }
    c.vy+=160*dt; c.x+=c.vx*dt; c.y+=c.vy*dt;
  }
  // idle hint
  if(G.phase==='play' && performance.now()-G.lastInput>9000){
    G.hintPulse+=dt;
  } else G.hintPulse=0;
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBolt(x,y,w,h,colIdx,dir,units,opts={}){
  const C=PALETTE[colIdx], r=Math.min(w,h)*0.26;
  ctx.save();
  if(opts.alpha!=null) ctx.globalAlpha=opts.alpha;
  // body: dark panel with a neon rim and inner color wash
  ctx.fillStyle='rgba(10,16,34,0.92)';
  rr(x,y,w,h,r); ctx.fill();
  const gr=ctx.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,C.d); gr.addColorStop(1,'rgba(10,16,34,0)');
  ctx.fillStyle=gr; ctx.globalAlpha*=0.75; rr(x,y,w,h,r); ctx.fill();
  ctx.globalAlpha=opts.alpha!=null?opts.alpha:1;
  ctx.strokeStyle=C.m; ctx.lineWidth=1.6; rr(x+0.8,y+0.8,w-1.6,h-1.6,r); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1;
  rr(x+3,y+3,w-6,h-6,Math.max(2,r-2)); ctx.stroke();
  // arrow
  if(dir){
    const [dc,dr]=DIRS[dir];
    const cx=x+w/2, cy=y+h/2;
    const L=(dc&&dr) ? Math.min(w,h)*0.32 : (dc?w:h)*0.30;
    const hw=Math.min(w,h)*0.16;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(Math.atan2(dr,dc));
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=hw*0.9; ctx.lineCap='round';
    for(const off of [1.6,0]){
      ctx.strokeStyle=off?'rgba(0,0,0,0.28)':'#fff';
      ctx.beginPath(); ctx.moveTo(-L,off); ctx.lineTo(L*0.45,off); ctx.stroke();
      ctx.fillStyle=off?'rgba(0,0,0,0.28)':'#fff';
      ctx.beginPath();
      ctx.moveTo(L*0.35,-hw+off*0); ctx.lineTo(L,off*1); ctx.lineTo(L*0.35,hw);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // units badge
  if(opts.badge && units>1){
    const bx=x+w-2, by=y+2;
    ctx.fillStyle='rgba(10,16,34,0.95)'; ctx.beginPath(); ctx.arc(bx,by,9,0,7); ctx.fill();
    ctx.strokeStyle=C.m; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='800 10px Menlo,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('×'+units,bx,by+0.5);
  }
  ctx.restore();
}

function drawSpool(cx,cy,size,colIdx,units,firing,aimAng){
  // cannon: dark emplacement with a turret barrel that tracks its target
  const C=PALETTE[colIdx];
  if(firing) drawGlow(cx,cy,size*0.95,C.m,0.40);
  ctx.save();
  ctx.translate(cx,cy);
  const w=size*0.94, r=size*0.15;
  ctx.fillStyle='rgba(10,16,34,0.92)';
  rr(-w/2,-w/2,w,w,r); ctx.fill();
  ctx.strokeStyle=C.m; ctx.lineWidth=1.6;
  rr(-w/2+0.8,-w/2+0.8,w-1.6,w-1.6,r); ctx.stroke();
  // turret
  ctx.save();
  ctx.rotate(aimAng==null?-Math.PI/2:aimAng);
  const bl=size*0.44, bw=Math.max(3.5,size*0.13);
  const kick=firing?Math.sin(Math.PI*Math.min(1,firing))* -size*0.06:0;
  ctx.translate(kick,0);
  ctx.fillStyle='#101a33'; ctx.strokeStyle=C.l; ctx.lineWidth=1.3;
  rr(size*0.06,-bw/2,bl,bw,bw*0.4); ctx.fill(); ctx.stroke();
  ctx.restore();
  // mount: glowing color hub
  const hubR=size*0.20*(firing?1.08:1);
  drawGlow(0,0,hubR*2.0,C.m,0.5);
  const gr=ctx.createRadialGradient(0,-hubR*0.2,hubR*0.12,0,0,hubR);
  gr.addColorStop(0,'#fff'); gr.addColorStop(0.4,C.l); gr.addColorStop(1,C.m);
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.arc(0,0,hubR,0,7); ctx.fill();
  // shells-remaining badge
  ctx.fillStyle='rgba(10,16,34,0.95)'; ctx.strokeStyle=C.m; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(w*0.40,-w*0.40,size*0.20,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`800 ${Math.max(10,size*0.25)}px Menlo,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(units,w*0.40,-w*0.40+0.5);
  ctx.restore();
}

function drawSnakeSeg(x,y,ang,colIdx,i){
  // a train car, top-down: symmetric rounded wagon with a glowing cargo bay
  const C=PALETTE[colIdx];
  const L=G.segLen*1.26, T=G.thick*0.82;
  drawGlow(x,y,T*0.8,C.m,0.22);
  ctx.save();
  ctx.translate(x,y); ctx.rotate(ang);
  const r=Math.min(L,T)*0.24;
  ctx.fillStyle='rgba(10,16,34,0.94)';
  rr(-L/2,-T/2,L,T,r); ctx.fill();
  const gr=ctx.createLinearGradient(0,-T/2,0,T/2);
  gr.addColorStop(0,C.d); gr.addColorStop(0.5,'rgba(10,16,34,0)'); gr.addColorStop(1,C.d);
  ctx.fillStyle=gr; ctx.globalAlpha=0.55;
  rr(-L/2,-T/2,L,T,r); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle=C.m; ctx.lineWidth=1.6;
  rr(-L/2+0.8,-T/2+0.8,L-1.6,T-1.6,r); ctx.stroke();
  // cargo bay
  ctx.fillStyle=C.m; ctx.globalAlpha=0.85;
  rr(-L*0.22,-T*0.22,L*0.44,T*0.44,2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawDragonHead(){
  const end=posAt(G.front);
  const R=headR();
  const open=G.mouthOpen;
  // the locomotive, top-down: a sleek bullet nose with a headlight beam
  drawGlow(end.x,end.y,R*1.8,'#ff3d71',0.38);
  ctx.save();
  ctx.translate(end.x,end.y); ctx.rotate(end.ang);
  const C={m:'#ff3d71',d:'#701a33',l:'#ff9ab4'};
  const L=R*2.3, T=R*1.25;
  // headlight beam
  const flick=0.10+Math.sin(G.crawlT*13)*0.02;
  ctx.fillStyle=`rgba(255,240,220,${flick})`;
  ctx.beginPath();
  ctx.moveTo(L*0.56,0);
  ctx.lineTo(L*0.56+R*2.5,-R*0.7);
  ctx.lineTo(L*0.56+R*2.5,R*0.7);
  ctx.closePath(); ctx.fill();
  // hull: rounded body tapering to a bullet nose, symmetric about the track
  const gr=ctx.createLinearGradient(-L/2,0,L*0.6,0);
  gr.addColorStop(0,'#12060c'); gr.addColorStop(0.55,C.d); gr.addColorStop(1,C.m);
  ctx.fillStyle=gr; ctx.strokeStyle=C.m; ctx.lineWidth=2; ctx.lineJoin='round';
  const r=T*0.28;
  ctx.beginPath();
  ctx.moveTo(-L*0.5+r,-T*0.5);
  ctx.lineTo(L*0.08,-T*0.5);
  ctx.quadraticCurveTo(L*0.46,-T*0.44,L*0.58,0);
  ctx.quadraticCurveTo(L*0.46,T*0.44,L*0.08,T*0.5);
  ctx.lineTo(-L*0.5+r,T*0.5);
  ctx.quadraticCurveTo(-L*0.5,T*0.5,-L*0.5,T*0.5-r);
  ctx.lineTo(-L*0.5,-T*0.5+r);
  ctx.quadraticCurveTo(-L*0.5,-T*0.5,-L*0.5+r,-T*0.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // canopy: dark slot behind the nose
  ctx.fillStyle='rgba(10,16,34,0.9)';
  rr(L*0.02,-T*0.28,L*0.18,T*0.56,3); ctx.fill();
  // center spine
  ctx.strokeStyle='rgba(255,154,180,0.45)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-L*0.40,0); ctx.lineTo(-L*0.02,0); ctx.stroke();
  // headlight
  drawGlow(L*0.56,0,R*0.6,'#ffffff',0.5);
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(L*0.54,0,R*0.15,0,7); ctx.fill();
  ctx.restore();
}

function drawCat(){
  // the core: a cyan crystal with a rotating containment ring
  const c=catPos(), danger=dangerFrac();
  const s=Math.max(15,A.snake.h*0.085);
  const flick=danger>0.68?0.7+Math.random()*0.3:1;
  drawGlow(c.x,c.y,s*2.6,'#00e0ff',0.35*flick);
  ctx.save(); ctx.translate(c.x,c.y);
  ctx.save();
  ctx.rotate(G.crawlT*0.7);
  ctx.strokeStyle=`rgba(90,216,255,${0.5*flick})`; ctx.lineWidth=1.5; ctx.setLineDash([5,7]);
  ctx.beginPath(); ctx.arc(0,0,s*1.35,0,7); ctx.stroke();
  ctx.restore();
  const pu=1+Math.sin(G.crawlT*2.5)*0.06;
  ctx.rotate(Math.PI/4);
  const d=s*0.95*pu;
  ctx.fillStyle='rgba(8,20,36,0.92)'; ctx.strokeStyle='#4dd8ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(-d/2,-d/2,d,d); ctx.fill(); ctx.stroke();
  ctx.fillStyle=danger>0.68?'#ff6be8':'#9ff4ff';
  const d2=d*0.42;
  ctx.fillRect(-d2/2,-d2/2,d2,d2);
  ctx.restore();
}

// ---------- main draw ----------
function draw(){
  // background: near-black with a faint blue build-grid
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1122'); bg.addColorStop(0.45,'#060a16'); bg.addColorStop(1,'#05060d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(96,170,255,0.05)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<=W;x+=26){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,H); }
  for(let y=0;y<=H;y+=26){ ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); }
  ctx.stroke();
  // placeable-cell grid under the board, tower-defence style
  if(G.mask){
    ctx.strokeStyle='rgba(96,170,255,0.10)'; ctx.lineWidth=1;
    for(const k of G.mask){
      const [c,r]=k.split(',').map(Number);
      ctx.strokeRect(G.ox+c*G.cell+0.5, G.oy+r*G.cell+0.5, G.cell-1, G.cell-1);
    }
  }

  // drifting neon motes
  for(const s of G.snow){
    ctx.globalAlpha=s.a*0.5;
    ctx.fillStyle=s.r>1.8?'#8fd8ff':'#ff77e0';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r*0.8,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // the track: twin neon rails with cross-ties
  ctx.save();
  const railOff=G.thick*0.30;
  ctx.strokeStyle='rgba(90,170,255,0.28)'; ctx.lineWidth=1.5; ctx.lineCap='round';
  for(const side of [-1,1]){
    ctx.beginPath();
    let first=true;
    for(let i=0;i<path.pts.length-3;i+=3){
      const p=path.pts[i], q=path.pts[i+3]||path.pts[path.pts.length-1];
      const dx=q[0]-p[0], dy=q[1]-p[1], d=Math.hypot(dx,dy)||1;
      const nx=-dy/d*railOff*side, ny=dx/d*railOff*side;
      first?ctx.moveTo(p[0]+nx,p[1]+ny):ctx.lineTo(p[0]+nx,p[1]+ny); first=false;
    }
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(90,170,255,0.13)'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let s=0;s<path.len;s+=14){
    const p=posAt(s), nx=-Math.sin(p.ang)*railOff*1.35, ny=Math.cos(p.ang)*railOff*1.35;
    ctx.moveTo(p.x-nx,p.y-ny); ctx.lineTo(p.x+nx,p.y+ny);
  }
  ctx.stroke();
  ctx.restore();

  // danger runway: neon pulse from the dragon to the kitty
  if(G.phase==='play'||G.phase==='lose'){
    const danger=dangerFrac(), cp=catPos();
    ctx.save();
    const pulse=danger>0.68?0.5+0.5*Math.abs(Math.sin(G.crawlT*6)):0;
    const rr2=Math.round(lerp(90,255,danger)), gg=Math.round(lerp(200,60,danger)), bb=Math.round(lerp(255,110,danger));
    ctx.strokeStyle=`rgba(${rr2},${gg},${bb},${0.35+danger*0.3+pulse*0.3})`;
    ctx.lineWidth=Math.max(4,G.thick*0.22); ctx.lineCap='round';
    ctx.setLineDash([9,10]); ctx.lineDashOffset=-G.crawlT*26;
    ctx.beginPath();
    let started=false;
    for(let s=G.front+headR()*2.4; s<catParam(); s+=7){
      const p=posAt(s);
      started?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); started=true;
    }
    if(started){ ctx.lineTo(cp.x-14,cp.y); ctx.stroke(); }
    ctx.restore();
  }

  drawCat();

  // train cars, rear first (offscreen strip included — they glide in past the edge)
  for(let i=G.snake.length-1;i>=0;i--){
    const s=segS(i,G.snake[i]);
    if(s<1) continue;
    const p=posAt(s);
    drawSnakeSeg(p.x,p.y,p.ang,G.snake[i].c,i);
  }
  if(G.snake.length||G.phase==='play') drawDragonHead();

  // tray
  const slots=traySlots();
  ctx.fillStyle='rgba(8,13,28,0.72)';
  rr(A.tray.x+W*0.015,A.tray.y-2,W*0.97,A.tray.h+4,8); ctx.fill();
  ctx.strokeStyle='rgba(120,200,255,0.18)'; ctx.lineWidth=1;
  rr(A.tray.x+W*0.015,A.tray.y-2,W*0.97,A.tray.h+4,8); ctx.stroke();
  for(const s of slots){
    const cx=s.x+s.s/2;
    if(s.kind==='open'){
      ctx.fillStyle='rgba(10,16,34,0.75)';
      rr(s.x,s.y,s.s,s.s,6); ctx.fill();
      ctx.strokeStyle='rgba(120,200,255,0.28)'; ctx.lineWidth=1;
      rr(s.x+0.5,s.y+0.5,s.s-1,s.s-1,6); ctx.stroke();
    } else {
      ctx.fillStyle='rgba(6,10,22,0.8)';
      rr(s.x,s.y,s.s,s.s,6); ctx.fill();
      ctx.save();
      ctx.strokeStyle='rgba(120,200,255,0.35)'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
      rr(s.x+1,s.y+1,s.s-2,s.s-2,6); ctx.stroke();
      ctx.restore();
      // vector padlock (emoji glyphs are unreliable in canvas on some phones)
      const ps=s.s*0.15, ly=s.y+s.s*0.36;
      ctx.strokeStyle='rgba(143,216,255,0.85)'; ctx.lineWidth=ps*0.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx,ly-ps*0.45,ps*0.65,Math.PI,0); ctx.stroke();
      ctx.fillStyle='rgba(143,216,255,0.9)';
      rr(cx-ps,ly-ps*0.5,ps*2,ps*1.45,ps*0.35); ctx.fill();
      ctx.fillStyle='rgba(6,10,22,0.9)';
      ctx.beginPath(); ctx.arc(cx,ly+ps*0.2,ps*0.26,0,7); ctx.fill();
      // price / unlock label
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if(s.kind==='lv5'){
        ctx.fillStyle='#8fd8ff'; ctx.font=`700 ${Math.max(9,s.s*0.19)}px Menlo,monospace`;
        ctx.fillText('LV 6',cx,s.y+s.s*0.76);
      } else {
        const can=save.coins>=PRICES.slot5;
        const pw=s.s*0.82, ph=Math.max(14,s.s*0.26), py=s.y+s.s*0.76;
        ctx.fillStyle='rgba(10,16,34,0.95)';
        rr(cx-pw/2,py-ph/2,pw,ph,4); ctx.fill();
        ctx.strokeStyle=can?'#6affd8':'rgba(255,215,106,0.55)'; ctx.lineWidth=1.2;
        rr(cx-pw/2,py-ph/2,pw,ph,4); ctx.stroke();
        ctx.fillStyle=can?'#6affd8':'#ffd76a'; ctx.font=`800 ${Math.max(9,ph*0.6)}px Menlo,monospace`;
        ctx.fillText('◆500',cx,py+0.5);
      }
    }
  }

  // board pieces (resting)
  const occ=(G.hintPulse>0)?boardOcc():null;
  let hintTarget=null;
  if(occ){
    const vis=new Set(visibleColors());
    const frees=G.pieces.filter(p=>p.state==='board'&&exitBlocker(p,occ,G.cols,G.rows)===null);
    hintTarget=frees.find(p=>vis.has(p.color))||frees[0]||null;
  }
  for(const p of G.pieces){
    if(p.state!=='board') continue;
    const r=pieceRect(p), pad=G.cell*0.06;
    let dx=0,dy=0,scale=1;
    if(p.drop && p.drop.t<1){
      const t=clamp(p.drop.t,0,1);
      if(t<=0){ continue; }
      scale=easeOutBack(t); dy=-(1-t)*40;
    }
    if(p.bump){
      const [dc,dr]=DIRS[p.dir], a=Math.sin(Math.PI*Math.min(1,p.bump.t))*7;
      dx=dc*a; dy+=dr*a;
    }
    if(hintTarget===p){ const pl=1+Math.sin(G.hintPulse*6)*0.05; scale*=pl; }
    ctx.save();
    ctx.translate(r.x+r.w/2+dx,r.y+r.h/2+dy); ctx.scale(scale,scale);
    drawBolt(-r.w/2+pad,-r.h/2+pad,r.w-pad*2,r.h-pad*2,p.color,p.dir,p.units,{});
    if(p.flash>0){
      ctx.globalAlpha=p.flash*0.45; ctx.fillStyle='#ff2d3d';
      rr(-r.w/2+pad,-r.h/2+pad,r.w-pad*2,r.h-pad*2,G.cell*0.24); ctx.fill();
    }
    ctx.restore();
  }

  // cannons in their slots (dim the ones with no target on screen)
  const visSet=new Set(visibleColors());
  for(const p of G.pieces){
    if(p.state!=='tray') continue;
    const c=slotCenter(p.slot);
    const sc=1+(p.landBounce||0)*0.25;
    let aimAng=null;
    if(p.shot){
      const idx=G.snake.indexOf(p.shot.seg);
      if(idx>=0){ const at=segXY(idx,p.shot.seg); aimAng=Math.atan2(at.y-c.y,at.x-c.x); }
    }
    const idle=!p.shot && !visSet.has(p.color);
    if(idle) ctx.globalAlpha=0.68;
    drawSpool(c.x,c.y,c.s*0.86*sc,p.color,p.units,p.shot?clamp(p.shot.t,0,1):0,aimAng);
    ctx.globalAlpha=1;
  }

  // moving pieces on top
  for(const p of G.pieces){
    if(p.state==='extract'){
      const r=pieceRect(p), pad=G.cell*0.06;
      const [dc,dr]=DIRS[p.dir];
      const d=easeInQuad(clamp(p.t,0,1))*p.exitCells*G.cell;
      drawBolt(r.x+pad+dc*d,r.y+pad+dr*d,r.w-pad*2,r.h-pad*2,p.color,p.dir,p.units,{});
    } else if(p.state==='fly'){
      const t=easeOutCubic(clamp(p.t,0,1));
      const to=p.slot!=null?slotCenter(p.slot):{x:W/2,y:A.tray.y-16,s:40};
      const cx=lerp(p.fx,to.x,t), cy=lerp(p.fy,to.y,t)-Math.sin(Math.PI*t)*46;
      const sz=(to.s||40);
      const w=lerp(G.cell*0.9,sz*0.6,t), h=lerp(G.cell*0.9*(p.len===2?1.9:1),sz*0.55,t);
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(t*Math.PI)*0.35);
      drawBolt(-w/2,-h/2,w,h,p.color,null,p.units,{});
      ctx.restore();
    }
  }
  // shells in flight: tracer rounds from cannon to car, with a muzzle flash
  for(const p of G.pieces){
    if(!p.shot) continue;
    const idx=G.snake.indexOf(p.shot.seg);
    if(idx<0) continue;
    const at=segXY(idx,p.shot.seg);
    const sp=spoolPos(p);
    const C=PALETTE[p.color];
    const t=clamp(p.shot.t,0,1);
    const cx=lerp(sp.x,at.x,t), cy=lerp(sp.y,at.y,t);
    if(t<0.3){
      const f=1-t/0.3;
      drawGlow(sp.x,sp.y,14*f+6,C.l,0.5*f);
    }
    const dx=at.x-sp.x, dy=at.y-sp.y, dd=Math.hypot(dx,dy)||1;
    const tl=Math.min(26,dd*0.25);
    ctx.strokeStyle=C.m; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.globalAlpha=0.8;
    ctx.beginPath(); ctx.moveTo(cx-dx/dd*tl,cy-dy/dd*tl); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.globalAlpha=1;
    drawGlow(cx,cy,9,C.m,0.5);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(cx,cy,2.6,0,7); ctx.fill();
  }

  // particles
  for(const p of G.particles){
    const a=1-p.t/p.dur;
    ctx.globalAlpha=a*(p.glow?0.85:1);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.glow?1+p.t*3:1),0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const c of G.confetti){
    ctx.globalAlpha=clamp(1.6-c.t/c.dur,0,1);
    ctx.fillStyle=c.c;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.t*c.sp);
    ctx.fillRect(-c.r,-c.r*0.6,c.r*2,c.r*1.2); ctx.restore();
  }
  ctx.globalAlpha=1;
  // drain streak readout
  if(G.windCombo>=5 && G.phase==='play'){
    ctx.save();
    ctx.fillStyle='#ffbe3d'; ctx.font='800 20px Menlo,monospace';
    ctx.textAlign='right'; ctx.textBaseline='alphabetic';
    ctx.shadowColor='rgba(255,170,40,0.8)'; ctx.shadowBlur=14;
    ctx.fillText('x'+G.windCombo, W-14, A.board.y-6);
    ctx.restore();
  }
  // red edge vignette when the dragon closes in
  if(G.phase==='play'){
    const danger=dangerFrac();
    if(danger>0.72){
      const a=(danger-0.72)/0.28*(0.24+Math.sin(G.crawlT*6)*0.06);
      const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.5,W/2,H/2,Math.max(W,H)*0.8);
      gr.addColorStop(0,'rgba(255,0,60,0)'); gr.addColorStop(1,`rgba(255,0,60,${a})`);
      ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    }
  }
}

// ---------- main loop ----------
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- boot ----------
resize();
$('gearBtn').innerHTML=ICONS.gear;
updateHud();
showMenu();
requestAnimationFrame(frame);

// debug hooks (console/testing only)
window.__wool = {
  G, save,
  frees(){ const occ=boardOcc(); return G.pieces.filter(p=>p.state==='board'&&exitBlocker(p,occ,G.cols,G.rows)===null).map(p=>({id:p.id,color:PALETTE[p.color].n,dir:p.dir})); },
  tap(id){ const p=pieceById(id); if(p&&p.state==='board') tryExtract(p); },
  tapMatching(){ const occ=boardOcc(); const vis=new Set(visibleColors());
    const p=G.pieces.find(q=>q.state==='board'&&vis.has(q.color)&&exitBlocker(q,occ,G.cols,G.rows)===null);
    if(p) tryExtract(p); return !!p; },
  visible(){ return visibleColors(); },
  state(){ return { phase:G.phase, level:G.level, snake:G.snake.length, board:G.pieces.filter(p=>p.state==='board').length,
    tray:G.pieces.filter(p=>p.state==='tray').length, coins:save.coins, cap:capacity(), gap:+dangerFrac().toFixed(2) }; },
  forceWin(){ G.snake.length=0; winCheck(); },
  winCheck, lose, capacity,
  gap(){ return dangerFrac(); },
  gen(L,slots){ return genLevel(L,slots||permSlots()); },
  step(dt){ update(dt||0.05); },
  setLevel(L){ G.level=L; startLevel(); },
  hide(){ hideOverlay(); },
  blockerOf(id){ const p=pieceById(id); return p?exitBlocker(p,boardOcc(),G.cols,G.rows):null; },
};
</script>
